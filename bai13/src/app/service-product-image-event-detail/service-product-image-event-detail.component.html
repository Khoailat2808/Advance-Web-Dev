<div class="detail">
  <button (click)="goBack()">Go Back</button>
  @if (selectedProduct) {
    <table>
      <tr>
        <td>ID:</td>
        <td>{{selectedProduct.ProductId}}</td>
      </tr>
      <tr>
        <td>Name:</td>
        <td>{{selectedProduct.ProductName}}</td>
      </tr>
      <tr>
        <td>Price:</td>
        <td>{{selectedProduct.Price}}</td>
      </tr>
      <tr>
        <td colspan="2">
          <img [src]="selectedProduct.Image" />
        </td>
      </tr>
    </table>
  } @else {
    <p>Không tìm thấy sản phẩm.</p>
  }
</div>
